<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOEIC 單字追蹤器</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/tracker.css">
</head>
<body>
  <div id="top-strip" class="top-strip">載入中...</div>
  <main class="app-shell tracker-shell">
    <header class="tracker-head">
      <div class="tracker-head-row">
        <div>
          <h1 class="page-title">TOEIC 單字追蹤器</h1>
          <p class="page-subtitle">以本機資料保存你的單字進度、錯因分析、精熟度與匯出紀錄。</p>
        </div>
        <button class="button secondary" type="button" onclick="location.href='./index.html'">返回首頁</button>
      </div>
      <nav id="tracker-tabs" class="tracker-tabs" aria-label="單字追蹤導覽"></nav>
    </header>

    <div id="empty-seed-banner" class="empty-seed-banner-shell" hidden></div>
    <div id="tracker-notice" class="section tracker-notice-shell"></div>
    <section id="tracker-view" class="tracker-view"></section>
  </main>

  <script src="./js/vocab-scoring.js"></script>
  <script src="./js/vocab-db.js"></script>
  <script src="./js/google-drive-sync-config.js"></script>
  <script src="./js/google-drive-sync-data.js"></script>
  <script src="./js/google-drive-sync-client.js"></script>
  <script type="module" src="./js/state.js"></script>
  <script type="module" src="./js/views/today.js"></script>
  <script type="module" src="./js/views/roadmap.js"></script>
  <script type="module" src="./js/views/lesson.js"></script>
  <script type="module" src="./js/views/mistakes.js"></script>
  <script type="module" src="./js/views/mastery.js"></script>
  <script type="module" src="./js/views/export.js"></script>
  <script type="module" src="./js/views/bank.js"></script>
  <script type="module" src="./js/views/settings.js"></script>
  <script type="module" src="./js/vocab-tracker.js"></script>
  <script>
    window.addEventListener("load", () => {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
      window.VocabTracker?.init();
    });
  </script>
</body>
</html>
